<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tests — FIN.store</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; background: #0D1520; color: #E6EDF5; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  #total { font-size: 16px; font-weight: 600; margin: 8px 0 16px; }
  #total.ok { color: #6FD5A3; }
  #total.ko { color: #F08A80; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 3px 0; border-bottom: 1px solid #1c2a3c; }
  li.ok .mark { color: #6FD5A3; }
  li.ko .mark { color: #F08A80; font-weight: 700; }
  .mark { display: inline-block; width: 1.5em; }
  .err { display: block; margin-left: 1.5em; color: #F08A80; font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Tests — FIN.store</h1>
<div id="total">Exécution…</div>
<ul id="out"></ul>

<script src="../js/util.js"></script>
<script src="../js/store.js"></script>
<script>
(function(){
  "use strict";
  const S = FIN.store, U = FIN.util;
  const tests = [];
  const test = (name, fn) => tests.push({ name, fn });

  // ─── Assertions ───
  function ok(cond, msg){ if (!cond) throw new Error(msg || "assertion fausse"); }
  function eq(a, b, msg){
    const x = JSON.stringify(a), y = JSON.stringify(b);
    if (x !== y) throw new Error((msg ? msg + " — " : "") + "attendu " + y + ", reçu " + x);
  }
  function throws(fn, re, msg){
    try { fn(); } catch (e) {
      if (re && !re.test(e.message)) throw new Error((msg || "") + " message inattendu : " + e.message);
      return e;
    }
    throw new Error((msg || "devait lever une erreur") + " (aucune erreur levée)");
  }

  // ─── Adaptateur mémoire ───
  function memAdapter(initial){
    let saved = initial === undefined ? null : JSON.parse(JSON.stringify(initial));
    const a = {
      kind: "local", saves: 0, loadError: null,
      async load(){ if (a.loadError) throw a.loadError; return saved === null ? null : JSON.parse(JSON.stringify(saved)); },
      async save(o){ a.saves++; saved = JSON.parse(JSON.stringify(o)); },
      get saved(){ return saved; }
    };
    return a;
  }

  let adapter, toasts, changes;
  FIN.bus.on("toast", p => toasts.push(p));
  FIN.bus.on("data:change", p => changes.push(p));

  async function fresh(initial){
    adapter = memAdapter(initial);
    toasts = []; changes = [];
    S.setAdapter(adapter);
    await S.init();
    changes = [];
  }
  const today = "2026-10-24";
  const exp = (over) => Object.assign({ date: today, amount: 10, categoryId: "food", note: "" }, over || {});

  // ═══ Ajout / validation ═══
  test("addExpense : crée une dépense complète et émet data:change", async () => {
    await fresh();
    const e = S.addExpense({ date: today, amount: 12.5, categoryId: "food", note: "Boulangerie" });
    ok(/^e_/.test(e.id), "id préfixé e_");
    eq([e.date, e.amount, e.categoryId, e.note], [today, 12.5, "food", "Boulangerie"]);
    ok(e.createdAt > 0 && e.updatedAt === e.createdAt, "horodatages");
    eq(S.getExpenses({}).length, 1);
    eq(changes.length, 1);
    ok(changes[0] && typeof changes[0].reason === "string", "reason");
  });
  test("addExpense : rejette montants invalides", async () => {
    await fresh();
    [0, -3, "abc", NaN, "", null, undefined, Infinity].forEach(v => throws(() => S.addExpense(exp({ amount: v })), /montant/i, "montant " + String(v)));
    eq(S.getExpenses({}).length, 0);
    eq(changes.length, 0, "aucun événement sur échec");
  });
  test("addExpense : rejette dates invalides", async () => {
    await fresh();
    ["2026-02-30", "24/10/2026", "2026-13-01", "", null, undefined, "2026-1-5"].forEach(v => throws(() => S.addExpense(exp({ date: v })), /date/i, "date " + String(v)));
    eq(S.getExpenses({}).length, 0);
  });
  test("addExpense : arrondi au centime et virgule décimale", async () => {
    await fresh();
    eq(S.addExpense(exp({ amount: 12.346 })).amount, 12.35);
    eq(S.addExpense(exp({ amount: "12,5" })).amount, 12.5);
    eq(S.addExpense(exp({ amount: "10,004" })).amount, 10);
    eq(S.addExpense(exp({ amount: "7 €" })).amount, 7);
  });
  test("addExpense : note absente → chaîne vide, note rognée", async () => {
    await fresh();
    eq(S.addExpense({ date: today, amount: 1, categoryId: "food" }).note, "");
    eq(S.addExpense(exp({ note: "  café  " })).note, "café");
  });
  test("addExpense : catégorie inconnue ou absente → other", async () => {
    await fresh();
    eq(S.addExpense(exp({ categoryId: "nimporte" })).categoryId, "other");
    eq(S.addExpense({ date: today, amount: 1 }).categoryId, "other");
  });
  test("getters : copies défensives", async () => {
    await fresh();
    const e = S.addExpense(exp());
    e.amount = 9999;
    S.getExpense(e.id).note = "piraté";
    S.getExpenses({})[0].amount = 1;
    S.getCategories()[0].name = "piraté";
    S.getSettings().weekStart = 5;
    S.getUI().x = 1;
    eq(S.getExpense(e.id).amount, 10);
    eq(S.getExpense(e.id).note, "");
    ok(S.getCategories()[0].name !== "piraté");
    eq(S.getSettings().weekStart, 1);
    eq(S.getUI(), {});
  });

  // ═══ Mise à jour ═══
  test("updateExpense : applique le patch, met à jour updatedAt", async () => {
    await fresh();
    const e = S.addExpense(exp({ note: "a" }));
    const u = S.updateExpense(e.id, { amount: "20,556", note: "b", categoryId: "fuel", date: "2026-10-01" });
    eq([u.amount, u.note, u.categoryId, u.date], [20.56, "b", "fuel", "2026-10-01"]);
    ok(u.updatedAt > e.updatedAt, "updatedAt augmente");
    eq(u.createdAt, e.createdAt);
    eq(u.id, e.id);
    eq(changes.length, 2);
  });
  test("updateExpense : patch invalide → erreur et rien ne change", async () => {
    await fresh();
    const e = S.addExpense(exp({ note: "a" }));
    throws(() => S.updateExpense(e.id, { note: "zzz", amount: -5 }), /montant/i);
    throws(() => S.updateExpense(e.id, { date: "pas-une-date" }), /date/i);
    eq(S.getExpense(e.id).note, "a", "note intacte (validation avant application)");
    throws(() => S.updateExpense("inconnu", { note: "x" }), /introuvable/i);
  });
  test("updateExpense : catégorie inconnue → other", async () => {
    await fresh();
    const e = S.addExpense(exp());
    eq(S.updateExpense(e.id, { categoryId: "zzz" }).categoryId, "other");
  });

  // ═══ Suppression / restauration ═══
  test("deleteExpense : renvoie l'objet, ajoute un tombstone", async () => {
    await fresh();
    const e = S.addExpense(exp({ note: "x" }));
    const d = S.deleteExpense(e.id);
    eq(d.id, e.id);
    eq(d.note, "x");
    eq(S.getExpense(e.id), null);
    eq(S.getExpenses({}).length, 0);
    const dump = JSON.parse(S.exportJSON());
    eq(dump.deleted.length, 1);
    eq([dump.deleted[0].id, dump.deleted[0].type], [e.id, "expense"]);
    ok(dump.deleted[0].deletedAt > 0);
    throws(() => S.deleteExpense(e.id), /introuvable/i, "double suppression");
  });
  test("restoreExpense : réintègre et retire le tombstone", async () => {
    await fresh();
    const e = S.addExpense(exp({ note: "x", amount: 33 }));
    const d = S.deleteExpense(e.id);
    const r = S.restoreExpense(d);
    eq([r.id, r.amount, r.note, r.date], [e.id, 33, "x", today]);
    ok(r.updatedAt > d.updatedAt, "updatedAt plus récent");
    eq(S.getExpenses({}).length, 1);
    eq(JSON.parse(S.exportJSON()).deleted.length, 0, "tombstone retiré");
    throws(() => S.restoreExpense({ id: "e_x", date: "nimp", amount: 5 }), /invalide/i);
  });
  test("tombstones : un seul par id, même après plusieurs cycles", async () => {
    await fresh();
    const e = S.addExpense(exp());
    S.restoreExpense(S.deleteExpense(e.id));
    S.deleteExpense(e.id);
    eq(JSON.parse(S.exportJSON()).deleted.length, 1);
  });

  // ═══ Filtres ═══
  test("getExpenses : bornes incluses, catégorie, tri date desc puis createdAt desc", async () => {
    await fresh();
    const a = S.addExpense(exp({ date: "2026-10-01", note: "a" }));
    const b = S.addExpense(exp({ date: "2026-10-15", note: "b", categoryId: "fuel" }));
    const c = S.addExpense(exp({ date: "2026-10-31", note: "c" }));
    const d = S.addExpense(exp({ date: "2026-11-01", note: "d" }));
    const e = S.addExpense(exp({ date: "2026-09-30", note: "e" }));
    eq(S.getExpenses({ from: "2026-10-01", to: "2026-10-31" }).map(x => x.note), ["c", "b", "a"], "bornes incluses");
    eq(S.getExpenses({ from: "2026-10-15" }).map(x => x.note), ["d", "c", "b"]);
    eq(S.getExpenses({ to: "2026-10-01" }).map(x => x.note), ["a", "e"]);
    eq(S.getExpenses({ categoryId: "fuel" }).map(x => x.note), ["b"]);
    eq(S.getExpenses().length, 5, "sans argument");
    eq(S.getExpenses({ from: "2026-12-01" }).length, 0);
    // Même jour : le plus récemment créé d'abord (on force createdAt via import).
    await fresh();
    const dump = JSON.parse(JSON.stringify({ version: 1, expenses: [
      { id: "e_1", date: today, amount: 1, categoryId: "food", note: "ancien", createdAt: 1000, updatedAt: 1000 },
      { id: "e_2", date: today, amount: 1, categoryId: "food", note: "récent", createdAt: 2000, updatedAt: 2000 }
    ]}));
    S.importJSON(JSON.stringify(dump), { mode: "replace" });
    eq(S.getExpenses({}).map(x => x.note), ["récent", "ancien"]);
  });

  // ═══ Catégories ═══
  test("catégories par défaut au premier lancement", async () => {
    await fresh();
    const cats = S.getCategories();
    eq(cats.length, U.DEFAULT_CATEGORIES.length);
    eq(cats.map(c => c.id), U.DEFAULT_CATEGORIES.map(c => c.id));
    ok(S.getCategory("other"), "other présente");
    eq(S.getCategory("inconnue"), null);
  });
  test("archiveCategory : masquée par défaut, visible avec includeArchived, getCategory la renvoie", async () => {
    await fresh();
    const n = S.getCategories().length;
    const e = S.addExpense(exp({ categoryId: "gifts" }));
    S.archiveCategory("gifts");
    eq(S.getCategories().length, n - 1);
    eq(S.getCategories({ includeArchived: true }).length, n);
    eq(S.getCategory("gifts").archived, true);
    eq(S.getExpense(e.id).categoryId, "gifts", "la dépense garde sa catégorie archivée");
    S.unarchiveCategory("gifts");
    eq(S.getCategories().length, n);
    throws(() => S.archiveCategory("other"), /autre/i, "other non archivable");
    throws(() => S.archiveCategory("zzz"), /introuvable/i);
  });
  test("addCategory / updateCategory", async () => {
    await fresh();
    const c = S.addCategory({ name: "  Animaux ", icon: "🐶", color: "#112233" });
    eq([c.name, c.icon, c.color, c.archived], ["Animaux", "🐶", "#112233", false]);
    ok(c.order >= U.DEFAULT_CATEGORIES.length, "ajoutée en dernier");
    eq(S.getCategories().slice(-1)[0].id, c.id);
    const u = S.updateCategory(c.id, { name: "Chiens", color: "#445566" });
    eq([u.name, u.color, u.icon], ["Chiens", "#445566", "🐶"]);
    ok(u.updatedAt > c.updatedAt);
    throws(() => S.addCategory({ name: "  " }), /nom/i);
    throws(() => S.addCategory({ name: "X", color: "rouge" }), /couleur/i);
    // une dépense peut utiliser la nouvelle catégorie
    eq(S.addExpense(exp({ categoryId: c.id })).categoryId, c.id);
  });
  test("reorderCategories", async () => {
    await fresh();
    S.archiveCategory("gifts");
    S.reorderCategories(["other", "food"]);
    const ids = S.getCategories().map(c => c.id);
    eq(ids.slice(0, 2), ["other", "food"]);
    eq(S.getCategories({ includeArchived: true }).length, U.DEFAULT_CATEGORIES.length, "aucune perdue");
    eq(new Set(S.getCategories({ includeArchived: true }).map(c => c.order)).size, U.DEFAULT_CATEGORIES.length, "orders uniques");
    throws(() => S.reorderCategories("nope"), /invalide/i);
  });
  test("nouvelles catégories par défaut ajoutées sans écraser celles de l'utilisateur", async () => {
    const base = U.DEFAULT_CATEGORIES.filter(c => c.id !== "gifts").map(c => Object.assign({}, c));
    base[0].name = "Resto perso";
    base.push({ id: "c_perso", name: "Perso", icon: "★", color: "#123456", order: 50, archived: false, updatedAt: 5 });
    await fresh({ version: 1, expenses: [], categories: base, settings: {}, deleted: [], ui: {} });
    ok(S.getCategory("gifts"), "gifts ajoutée");
    eq(S.getCategory("food").name, "Resto perso", "renommage conservé");
    ok(S.getCategory("c_perso"), "catégorie perso conservée");
    ok(S.getCategory("gifts").order > 50, "ajoutée à la fin");
  });
  test("dépense chargée avec catégorie inconnue → other", async () => {
    await fresh({ version: 1, expenses: [{ id: "e_1", date: today, amount: 5, categoryId: "disparue", note: "", createdAt: 1, updatedAt: 1 }] });
    eq(S.getExpense("e_1").categoryId, "other");
  });

  // ═══ Réglages / UI ═══
  test("settings : valeurs par défaut, patch, validation", async () => {
    await fresh();
    eq([S.getSettings().weekStart, S.getSettings().currency, S.getSettings().monthlyBudget], [1, "EUR", null]);
    S.setSettings({ weekStart: 0, monthlyBudget: "1500,5" });
    eq([S.getSettings().weekStart, S.getSettings().monthlyBudget], [0, 1500.5]);
    S.setSettings({ monthlyBudget: null });
    eq(S.getSettings().monthlyBudget, null);
    ok(S.getSettings().updatedAt > 0);
    throws(() => S.setSettings({ weekStart: 9 }), /semaine/i);
    throws(() => S.setSettings({ monthlyBudget: -4 }), /budget/i);
    eq(S.getSettings().weekStart, 0);
  });
  test("setUI / getUI : persisté sans émettre data:change", async () => {
    await fresh();
    S.setUI({ view: "month", zoom: 1.2 });
    S.setUI({ view: "week" });
    eq(S.getUI(), { view: "week", zoom: 1.2 });
    eq(changes.length, 0, "pas de data:change");
    await S.flush();
    eq(adapter.saved.ui, { view: "week", zoom: 1.2 });
  });

  // ═══ Persistance ═══
  test("sauvegarde débouncée + flush, et rechargement identique", async () => {
    await fresh();
    await S.flush();
    const n = adapter.saves;
    const e = S.addExpense(exp({ note: "persist" }));
    eq(adapter.saves, n, "pas d'écriture immédiate");
    await S.flush();
    eq(adapter.saves, n + 1);
    eq(adapter.saved.expenses.length, 1);
    S.setAdapter(adapter);
    await S.init();
    eq(S.getExpense(e.id).note, "persist");
    eq(S.getCategories().length, U.DEFAULT_CATEGORIES.length);
  });
  test("sauvegarde automatique après ~250 ms", async () => {
    await fresh();
    await S.flush();
    const n = adapter.saves;
    S.addExpense(exp());
    await new Promise(r => setTimeout(r, 450));
    eq(adapter.saves, n + 1);
  });
  test("lecture impossible : toast, aucune écriture, données existantes préservées", async () => {
    adapter = memAdapter({ version: 1, expenses: [] });
    adapter.loadError = new Error("fichier corrompu");
    toasts = []; changes = [];
    S.setAdapter(adapter);
    await S.init();
    ok(toasts.length === 1 && /fichier corrompu/.test(toasts[0].text), "toast d'erreur");
    S.addExpense(exp());
    await S.flush();
    await new Promise(r => setTimeout(r, 350));
    eq(adapter.saves, 0, "aucune écriture");
  });
  test("échec d'écriture : toast, pas d'exception", async () => {
    await fresh();
    adapter.save = async () => { throw new Error("disque plein"); };
    S.addExpense(exp());
    await S.flush();
    ok(toasts.some(t => /disque plein/.test(t.text)), "toast d'échec");
    eq(S.getExpenses({}).length, 1, "données en mémoire conservées");
  });
  test("fichier d'une version plus récente refusé à la lecture", async () => {
    await fresh({ version: 99, expenses: [] });
    ok(toasts.length === 1, "toast");
    S.addExpense(exp());
    await S.flush();
    eq(adapter.saves, 0);
  });
  test("storageInfo", async () => {
    await fresh();
    eq(S.storageInfo(), { kind: "local" });
    ok(S._adapter === adapter, "_adapter exposé");
    S.openDataFolder(); // no-op hors Electron
  });

  // ═══ Import / export JSON ═══
  test("exportJSON → importJSON(replace) : aller-retour", async () => {
    await fresh();
    S.addExpense(exp({ amount: 5, note: "un" }));
    S.addExpense(exp({ amount: 6, note: "deux", categoryId: "fuel" }));
    S.addCategory({ name: "Perso", color: "#abcdef" });
    S.setSettings({ weekStart: 0 });
    const json = S.exportJSON();
    const before = S.getExpenses({}).map(e => e.id).sort();
    await fresh();
    const r = S.importJSON(json, { mode: "replace" });
    eq(r.added, 2);
    eq(r.updated, 0);
    eq(S.getExpenses({}).map(e => e.id).sort(), before);
    eq(S.getSettings().weekStart, 0);
    ok(S.getCategories().some(c => c.name === "Perso"));
    eq(changes.length, 1);
  });
  test("importJSON(replace) : efface l'existant", async () => {
    await fresh();
    S.addExpense(exp({ note: "local" }));
    const file = JSON.stringify({ version: 1, expenses: [{ id: "e_f", date: today, amount: 3, categoryId: "food", note: "fichier", createdAt: 1, updatedAt: 1 }] });
    S.importJSON(file, { mode: "replace" });
    eq(S.getExpenses({}).map(e => e.note), ["fichier"]);
    eq(S.getCategories().length, U.DEFAULT_CATEGORIES.length, "catégories par défaut recréées");
  });
  test("importJSON(merge) : ajoute, le plus récent updatedAt gagne", async () => {
    await fresh({ version: 1, expenses: [
      { id: "e_a", date: today, amount: 1, categoryId: "food", note: "local-a", createdAt: 1000, updatedAt: 5000 },
      { id: "e_b", date: today, amount: 2, categoryId: "food", note: "local-b", createdAt: 1000, updatedAt: 5000 },
      { id: "e_c", date: today, amount: 3, categoryId: "food", note: "local-c", createdAt: 1000, updatedAt: 5000 }
    ]});
    const file = JSON.stringify({ version: 1, expenses: [
      { id: "e_a", date: today, amount: 99, categoryId: "food", note: "fichier-a", createdAt: 1000, updatedAt: 6000 },  // plus récent → gagne
      { id: "e_b", date: today, amount: 98, categoryId: "food", note: "fichier-b", createdAt: 1000, updatedAt: 4000 },  // plus ancien → perd
      { id: "e_c", date: today, amount: 97, categoryId: "food", note: "fichier-c", createdAt: 1000, updatedAt: 5000 },  // égalité → local gagne
      { id: "e_d", date: today, amount: 4, categoryId: "food", note: "fichier-d", createdAt: 1000, updatedAt: 1000 }     // nouveau
    ]});
    const r = S.importJSON(file, { mode: "merge" });
    eq([r.added, r.updated], [1, 1]);
    eq(S.getExpense("e_a").note, "fichier-a");
    eq(S.getExpense("e_b").note, "local-b");
    eq(S.getExpense("e_c").note, "local-c");
    eq(S.getExpense("e_d").note, "fichier-d");
    eq(S.getExpenses({}).length, 4);
  });
  test("importJSON(merge) : tombstones respectés", async () => {
    await fresh();
    const e = S.addExpense(exp({ note: "x" }));
    S.deleteExpense(e.id);
    const old = { id: e.id, date: today, amount: 1, categoryId: "food", note: "ancienne version", createdAt: 1, updatedAt: 1 };
    let r = S.importJSON(JSON.stringify({ version: 1, expenses: [old] }), { mode: "merge" });
    eq(r.added, 0, "pas de résurrection par une version plus ancienne");
    eq(S.getExpense(e.id), null);
    const newer = Object.assign({}, old, { updatedAt: Date.now() + 100000, note: "modifiée après" });
    r = S.importJSON(JSON.stringify({ version: 1, expenses: [newer] }), { mode: "merge" });
    eq(r.added, 1, "modification postérieure à la suppression → réapparaît");
    eq(JSON.parse(S.exportJSON()).deleted.length, 0, "tombstone retiré");
    // suppression venue du fichier
    await fresh();
    const f = S.addExpense(exp());
    const del = { version: 1, expenses: [], deleted: [{ id: f.id, type: "expense", deletedAt: Date.now() + 1000 }] };
    S.importJSON(JSON.stringify(del), { mode: "merge" });
    eq(S.getExpense(f.id), null, "suppression distante appliquée");
  });
  test("importJSON(merge) : catégories fusionnées, catégorie inconnue → other", async () => {
    await fresh();
    const file = JSON.stringify({ version: 1,
      categories: [{ id: "c_new", name: "Nouvelle", icon: "N", color: "#010203", order: 0, archived: false, updatedAt: 10 },
                   { id: "food", name: "Miam", icon: "M", color: "#ffffff", order: 0, archived: false, updatedAt: Date.now() + 5000 }],
      expenses: [{ id: "e_1", date: today, amount: 5, categoryId: "c_new", note: "", createdAt: 1, updatedAt: 1 },
                 { id: "e_2", date: today, amount: 5, categoryId: "fantome", note: "", createdAt: 1, updatedAt: 1 }] });
    S.importJSON(file, { mode: "merge" });
    ok(S.getCategory("c_new"), "nouvelle catégorie");
    eq(S.getCategory("food").name, "Miam", "catégorie plus récente gagne");
    eq(S.getExpense("e_1").categoryId, "c_new");
    eq(S.getExpense("e_2").categoryId, "other");
  });
  test("importJSON : refuse les fichiers invalides sans rien modifier", async () => {
    await fresh();
    const keep = S.addExpense(exp({ note: "garde" }));
    changes = [];
    const bad = [
      "",
      "pas du json {",
      "[]",
      "42",
      "null",
      JSON.stringify({ version: 1 }),
      JSON.stringify({ version: 1, expenses: "x" }),

    S.deleteIncome(i.id); eq(dirtyIds(), [i.id], "deleteIncome"); cleanAll();

  test("synchro : forme des records (objets, réglages, tombstones)", async () => {

    const by = id => recs.find(r => r.id === id);

    eq(by(i.id).type, "income");
    eq(by(i.id).data, S.getIncome(i.id));
    eq(by("food").type, "category");
    eq(by("settings").type, "settings");
    eq(by("settings").data, S.getSettings());
    eq(by("settings").updated_at, S.getSettings().updatedAt);
    const t = by(gone.id);
    eq([t.type, t.data, t.deleted], ["expense", null, true]);
    ok(t.updated_at > 0, "updated_at = deletedAt");
    eq(recs.length, U.DEFAULT_CATEGORIES.length + 1 + 2 + 1, "catégories + réglages + 2 objets + 1 tombstone");
    eq(S.syncRecords({ dirtyOnly: true }).length, 3, "seuls les ids touchés : dépense, revenu, dépense supprimée");

  test("importJSON ne touche pas à l'état de synchro (replace et merge) mais marque l'importé comme sale", async () => {

  test("applyRemote : le plus récent updated_at gagne, rien n'est marqué sale, un seul data:change", async () => {
    await fresh();
    const a = S.addExpense(exp({ note: "a" }));
    const b = S.addExpense(exp({ note: "b" }));
    const c = S.addExpense(exp({ note: "c" }));
    cleanAll();
    changes = [];
    const r = S.applyRemote([
      rec(a.id, "expense", Object.assign({}, a, { note: "a-distant", amount: 77 }), a.updatedAt + 10),   // plus récent → appliqué
      rec(b.id, "expense", Object.assign({}, b, { note: "b-distant" }), b.updatedAt - 1),                // plus ancien → ignoré
      rec(c.id, "expense", Object.assign({}, c, { note: "c-distant" }), c.updatedAt),                    // égal → ignoré
      rec("e_new", "expense", { id: "e_new", date: today, amount: "12,5", categoryId: "food", note: " neuf ", createdAt: 5 }, 50)
    ]);
    eq(r.applied, 2);
    eq(S.getExpense(a.id).note, "a-distant");
    eq(S.getExpense(a.id).updatedAt, a.updatedAt + 10);
    eq(S.getExpense(b.id).note, "b");
    eq(S.getExpense(c.id).note, "c");
    eq([S.getExpense("e_new").amount, S.getExpense("e_new").note], [12.5, "neuf"], "normalisé comme à la lecture disque");
    eq(changes.length, 1, "un seul data:change");
    eq(changes[0].reason, "sync");
    eq(dirtyIds(), [], "rien de sale");
    changes = [];
    eq(S.applyRemote([rec(b.id, "expense", b, b.updatedAt - 5)]).applied, 0);
    eq(changes.length, 0, "aucun événement s'il n'y a eu aucun changement");
    eq(S.applyRemote([]).applied, 0);
  });

  test("applyRemote : suppressions distantes, tombstones respectés, résurrection par un record plus récent", async () => {
    await fresh();
    const e = S.addExpense(exp({ note: "x" }));
    const i = S.addIncome(inc());
    cleanAll();
    // suppression plus ancienne que la dernière modification locale → ignorée
    eq(S.applyRemote([rec(e.id, "expense", null, e.updatedAt - 1, true)]).applied, 0);
    ok(S.getExpense(e.id), "toujours là");
    // suppression plus récente → appliquée, avec tombstone
    const at = e.updatedAt + 100;
    changes = [];
    eq(S.applyRemote([rec(e.id, "expense", null, at, true), rec(i.id, "income", null, i.updatedAt + 1, true)]).applied, 2);
    eq(changes.length, 1);
    eq(S.getExpense(e.id), null);
    eq(S.getIncome(i.id), null);
    const dump = JSON.parse(S.exportJSON());
    eq(dump.deleted.map(t => [t.id, t.type, t.deletedAt]).sort(), [[e.id, "expense", at], [i.id, "income", i.updatedAt + 1]].sort());
    eq(dirtyIds(), []);
    // un record plus ancien que le tombstone ne ressuscite pas l'objet
    eq(S.applyRemote([rec(e.id, "expense", e, at - 1)]).applied, 0);
    eq(S.getExpense(e.id), null);
    // un record plus récent le ressuscite et retire le tombstone
    eq(S.applyRemote([rec(e.id, "expense", Object.assign({}, e, { note: "revenu" }), at + 1)]).applied, 1);
    eq(S.getExpense(e.id).note, "revenu");
    eq(JSON.parse(S.exportJSON()).deleted.map(t => t.id), [i.id]);
    // suppression d'un id jamais vu : tombstone posé (empêche une résurrection tardive)
    S.applyRemote([rec("e_jamais_vu", "expense", null, 500, true)]);
    eq(S.applyRemote([rec("e_jamais_vu", "expense", { id: "e_jamais_vu", date: today, amount: 1, createdAt: 1 }, 400)]).applied, 0);
    eq(S.getExpense("e_jamais_vu"), null);
  });

    eq(S.getExpense("e_2").categoryId, "fantome");

    S.applyRemote([rec("food", "category", Object.assign({}, S.getCategory("food"), { name: "Miam" }), 5000)]);
    eq(S.getCategory("food").name, "Miam");
    S.applyRemote([rec("food", "category", Object.assign({}, S.getCategory("food"), { name: "Vieux" }), 4000)]);

  // ─── Exécution ───
  (async function run(){
    const out = document.getElementById("out");
    let pass = 0, fail = 0;
    for (const t of tests) {
      const li = document.createElement("li");
      try {
        await t.fn();
        pass++;
        li.className = "ok";
        li.innerHTML = '<span class="mark">✓</span>';
      } catch (e) {
        fail++;
        li.className = "ko";
        li.innerHTML = '<span class="mark">✗</span>';
        const msg = document.createElement("span");
        msg.className = "err";
        msg.textContent = (e && e.stack) ? e.message + "\n" + e.stack.split("\n").slice(1, 3).join("\n") : String(e);
        li.appendChild(document.createTextNode(t.name));
        li.appendChild(msg);
        out.appendChild(li);
        continue;
      }
      li.appendChild(document.createTextNode(t.name));
      out.appendChild(li);
    }
    const total = document.getElementById("total");
    total.textContent = pass + " / " + tests.length + " tests réussis" + (fail ? " — " + fail + " échec(s)" : " ✓");
    total.className = fail ? "ko" : "ok";
  })();
})();
